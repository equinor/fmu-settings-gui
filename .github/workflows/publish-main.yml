name: Publish main wheel

on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: publish-main-wheel
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-wheel:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout commit locally
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: 3.12

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install build dependencies
        run: python -m pip install --upgrade build

      - name: Build wheel
        env:
          SETUPTOOLS_SCM_PRETEND_VERSION: "99.0.0"
        run: python -m build --wheel --verbose

      - name: Verify wheel
        run: |
          python -m venv wheel-test
          wheel-test/bin/python -m pip install --no-deps dist/fmu_settings_gui-99.0.0-py3-none-any.whl
          wheel-test/bin/python - <<'PY'
          from importlib.metadata import version
          from importlib.resources import files

          assert version("fmu-settings-gui") == "99.0.0"
          static = files("fmu_settings_gui").joinpath("static")

          # Verify the main application and authentication redirect entry points.
          assert static.joinpath("index.html").is_file()
          assert static.joinpath("redirect.html").is_file()

          # Verify that the wheel contains the compiled application assets.
          assert any(
              asset.name.endswith(".js")
              for asset in static.joinpath("assets").iterdir()
          )
          PY

      - name: Upload wheel to bleeding release
        run: >
          gh release upload bleeding
          dist/fmu_settings_gui-99.0.0-py3-none-any.whl
          --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
