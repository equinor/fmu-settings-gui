name: Publish main wheel to GitHub

on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: publish-main-wheel-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-wheel:
    if: ${{ github.repository == 'equinor/fmu-settings-gui' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout commit locally
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: 3.12

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Install build dependencies
        run: python -m pip install --upgrade build

      - name: Build wheel
        env:
          # Komodo reads the version from the wheel filename. Use a valid, fixed
          # version so the bleeding release asset has a stable download URL.
          SETUPTOOLS_SCM_PRETEND_VERSION: "99.0.0"
        run: python -m build --wheel --verbose

      - name: Verify wheel
        run: |
          python -m venv wheel-test
          wheel-test/bin/python -m pip install --no-deps dist/fmu_settings_gui-99.0.0-py3-none-any.whl
          wheel-test/bin/python - <<'PY'
          from importlib.metadata import version

          from fmu_settings_gui import get_static_directory

          assert version("fmu-settings-gui") == "99.0.0"
          static = get_static_directory()

          # Verify the main application and authentication redirect entry points.
          assert (static / "index.html").is_file()
          assert (static / "redirect.html").is_file()

          # Verify that the wheel contains the compiled application assets.
          assert any(static.glob("assets/*.js"))
          PY

      - name: Upload wheel to bleeding release
        if: github.ref == 'refs/heads/main'
        # Replace the wheel after each main build so Komodo gets current code
        # from the same bleeding release URL.
        run: >
          gh release upload bleeding-main
          dist/fmu_settings_gui-99.0.0-py3-none-any.whl
          --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
